<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<meta name="theme-color" content="#f6f4ef">
<title>Einkaufsliste</title>
<link rel="apple-touch-icon" id="appleIcon">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2421; --muted:#6b726d; --line:#e4e1d8;
  --accent:#2f7d4f; --accent-soft:#e3f1e8; --warn:#b54a2c; --chip:#efece4; --done:#a6aba7; --star:#e0a100;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141715; --card:#1d211f; --ink:#ecefe9; --muted:#9aa29c; --line:#2c312e;
    --accent:#5cbf84; --accent-soft:#1f3328; --warn:#e07a5f; --chip:#262b28; --done:#5d645f; --star:#f2c14e; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 84px)}
button{font-family:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:24px;margin:0;flex:1;letter-spacing:-.3px}
.count{color:var(--muted);font-size:14px;font-weight:500}
.iconbtn{border:0;background:var(--chip);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px;display:grid;place-items:center;cursor:pointer;position:relative}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--done)}
.dot.ok{background:var(--accent)} .dot.err{background:var(--warn)} .dot.busy{background:#d9a93a}
.addbar{position:sticky;top:60px;z-index:4;background:var(--bg);padding:0 16px 10px}
.addrow{display:flex;gap:8px}
.inp{min-width:0;font-size:17px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.inp:focus{border-color:var(--accent)}
#addName{flex:1}
#addQty{width:64px;text-align:center;padding:12px 6px}
.addrow .plus{border:0;background:var(--accent);color:#fff;font-size:24px;width:50px;border-radius:14px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.sel{background:var(--accent);color:#fff}
.chip.lbl{background:none;color:var(--muted);cursor:default;padding-left:2px}
.wrap{flex-wrap:wrap;overflow:visible}
main{padding:0 16px}
.view{display:none} .view.on{display:block}
.group h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 4px 6px;font-weight:600}
.list{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:15px;padding:0}
.item.done .check{background:var(--accent);border-color:var(--accent)}
.body{flex:1;min-width:0;cursor:pointer}
.name{font-size:17px;overflow-wrap:anywhere}
.detail{font-size:14px;color:var(--ink);opacity:.75}
.note{font-size:13px;color:var(--muted)}
.item.done .name,.item.done .detail{color:var(--done);text-decoration:line-through}
.qty{flex:none;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.item.done .qty{background:var(--chip);color:var(--done)}
.offer{display:inline-block;margin-top:3px;font-size:12px;background:#fff3cf;color:#7a5600;padding:2px 8px;border-radius:8px}
.star{color:var(--star)}
.addsmall{flex:none;border:0;background:var(--accent-soft);color:var(--accent);width:38px;height:38px;border-radius:12px;font-size:22px;cursor:pointer}
.donehead{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 6px}
.donehead h2{margin:0}
.link{border:0;background:none;color:var(--warn);font-size:14px;cursor:pointer;padding:4px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty b{display:block;font-size:40px;margin-bottom:8px}
.catsec{margin-top:6px}
.catsec .chips{padding-top:0}
.search{width:100%;margin:2px 0 4px}
a.linkcard{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
a.linkcard:first-child{border-top:0}
a.linkcard span{flex:1}
a.linkcard small{display:block;color:var(--muted);font-size:13px}
a.linkcard i{font-style:normal;color:var(--muted)}
.intro{color:var(--muted);font-size:14px;margin:4px 4px 0}
/* Tabbar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:21px;font-weight:400;line-height:1.2}
nav button.on{color:var(--accent);font-weight:600}
/* Sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.backdrop.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow:auto;transform:translateY(105%);
  transition:transform .22s ease,visibility .22s;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sheethead h3{margin:0;font-size:20px;flex:1}
.starbtn{border:0;background:var(--chip);border-radius:12px;width:44px;height:44px;font-size:22px;cursor:pointer;color:var(--muted)}
.starbtn.on{color:var(--star)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.field{width:100%;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.qtyrow{display:flex;gap:8px;align-items:center}
.qtyrow button{width:44px;height:44px;border-radius:12px;border:0;background:var(--chip);color:var(--ink);font-size:22px;cursor:pointer;flex:none}
.qtyrow input{width:72px;text-align:center;font-size:18px;font-weight:700}
.qtyrow select{flex:1}
.row{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;cursor:pointer;background:var(--chip);color:var(--ink);text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.offerbox{margin-top:16px;padding:12px;border-radius:14px;background:var(--bg);border:1px dashed var(--line)}
.offerbox b{font-size:15px}
.offerrow{display:flex;gap:8px;margin-top:8px}
.offerrow .field{flex:1;min-width:0}
.offer.old{background:var(--chip);color:var(--muted);text-decoration:line-through}
.sortbar{display:flex;align-items:center;gap:8px;padding-top:8px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.group h2 .sub{text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px}
.shopcard{padding:12px 14px;border-top:1px solid var(--line)}
.shopcard:first-child{border-top:0}
.shopcard .sum{float:right;font-weight:700;color:var(--accent)}
.shopcard ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.offerlink{display:block;margin-top:14px;font-size:14px;color:var(--accent);text-decoration:none}
.log{font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border-radius:10px;padding:8px 10px;max-height:180px;overflow:auto;margin-top:6px}
.log .e{color:var(--warn)}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%) translateY(200px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;transition:transform .2s;display:flex;gap:12px;align-items:center;max-width:90vw}
.toast.show{transform:translateX(-50%)}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer}
.ver{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
</style>
</head>
<body>

<header>
  <h1 id="title">Einkauf <span class="count" id="count"></span></h1>
  <button class="iconbtn" id="syncBtn" title="Synchronisieren">⟳<span class="dot" id="syncDot"></span></button>
  <button class="iconbtn" id="settingsBtn" title="Einstellungen">⚙︎</button>
</header>

<!-- LISTE -->
<section class="view on" id="v-liste">
  <div class="addbar">
    <form class="addrow" id="addForm" autocomplete="off">
      <input class="inp" id="addName" placeholder="Artikel" enterkeyhint="done">
      <input class="inp" id="addQty" type="number" inputmode="numeric" min="1" max="999" value="1" aria-label="Menge">
      <button type="submit" class="plus" aria-label="Hinzufügen">+</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="sortbar">
      <div class="seg" id="sortSeg"><button data-sort="cat">Nach Bereich</button><button data-sort="shop">Nach Händler</button></div>
    </div>
    <div class="chips" id="shopFilter"></div>
  </div>
  <main id="listMain"></main>
</section>

<!-- ARTIKEL -->
<section class="view" id="v-artikel">
  <div class="addbar"><input class="inp search" id="catSearch" placeholder="Artikel suchen …" autocomplete="off"></div>
  <main id="catMain"></main>
</section>

<!-- FAVORITEN -->
<section class="view" id="v-favoriten"><main id="favMain"></main></section>

<!-- ANGEBOTE -->
<section class="view" id="v-angebote"><main id="offMain"></main></section>

<nav id="tabs">
  <button data-tab="liste" class="on"><b>🧾</b>Liste</button>
  <button data-tab="artikel"><b>📚</b>Artikel</button>
  <button data-tab="favoriten"><b>⭐</b>Favoriten</button>
  <button data-tab="angebote"><b>🏷</b>Angebote</button>
</nav>

<div class="backdrop" id="backdrop"></div>

<!-- Artikel-Blatt (hinzufügen & bearbeiten) -->
<div class="sheet" id="itemSheet">
  <div class="sheethead">
    <h3 id="sTitle">Artikel</h3>
    <button class="starbtn" id="sStar" title="Favorit">☆</button>
  </div>
  <label>Artikel</label>
  <input class="field" id="sName" autocomplete="off">
  <label>Genaue Bezeichnung</label>
  <div class="chips wrap" id="sVariants"></div>
  <input class="field" id="sDetail" placeholder="oder selbst eingeben, z. B. Melitta Bella Crema" autocomplete="off" style="margin-top:8px">
  <label>Menge</label>
  <div class="qtyrow">
    <button id="sMinus" type="button">−</button>
    <input class="field" id="sQty" type="number" inputmode="numeric" min="1" max="9999">
    <button id="sPlus" type="button">+</button>
    <select class="field" id="sUnit"></select>
  </div>
  <label>Bereich im Markt</label>
  <select class="field" id="sCat"></select>
  <label>Notiz</label>
  <input class="field" id="sNote" placeholder="optional" autocomplete="off">
  <div class="offerbox">
    <b>🏷 Angebot</b>
    <a class="offerlink" id="sOffer" target="_blank" rel="noopener" style="margin-top:4px">🔎 bei marktguru suchen</a>
    <div class="chips wrap" id="sShops" style="padding-top:8px"></div>
    <div class="offerrow">
      <input class="field" id="sShop" placeholder="Markt" autocomplete="off">
      <input class="field" id="sPrice" placeholder="Preis €" inputmode="decimal" autocomplete="off" style="max-width:110px">
    </div>
    <div class="offerrow" style="align-items:center">
      <span class="hint" style="margin:0;white-space:nowrap">gültig bis</span>
      <input class="field" id="sUntil" type="date">
      <button type="button" class="link" id="sOfferClear">entfernen</button>
    </div>
  </div>
  <div class="row" id="sBtnsAdd">
    <button class="btn" data-close>Abbrechen</button>
    <button class="btn primary" id="sAdd">Auf die Liste</button>
  </div>
  <div class="row" id="sBtnsEdit">
    <button class="btn danger" id="sDelete">Löschen</button>
    <button class="btn primary" id="sSave">Speichern</button>
  </div>
</div>

<!-- Einstellungen -->
<div class="sheet" id="setSheet">
  <h3>Einstellungen</h3>
  <b>Gemeinsamer Sync über GitHub</b>
  <div class="hint">Die Liste wird als <code>einkaufsliste.json</code> im Repo gespeichert. Beide Handys brauchen dieselben Angaben.</div>
  <label>GitHub-Benutzer</label><input class="field" id="gOwner" autocapitalize="off" autocorrect="off">
  <label>Repository</label><input class="field" id="gRepo" autocapitalize="off" autocorrect="off">
  <label>Token (Fine-grained, nur dieses Repo, „Contents: Read and write“)</label>
  <input class="field" id="gToken" type="password" autocapitalize="off" autocorrect="off">
  <div class="row">
    <button class="btn" id="gTest">Verbindung testen</button>
    <button class="btn primary" id="gSave">Speichern</button>
  </div>
  <details>
    <summary>Sync-Verlauf</summary>
    <div class="log" id="syncLog"></div>
  </details>
  <details>
    <summary>Daten</summary>
    <div class="row">
      <button class="btn" id="exportBtn">Exportieren</button>
      <button class="btn" id="importBtn">Importieren</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <div class="row"><button class="btn danger" id="favReset">„Häufig gekauft“ leeren</button></div>
  </details>
  <div class="row"><button class="btn" data-close>Schließen</button></div>
  <div class="ver" id="ver"></div>
</div>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastBtn" hidden>Rückgängig</button></div>

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function nextSaturday() {
  const d = new Date(); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parsePrice(s) { const n = parseFloat(String(s || '').replace(/[^\d,.-]/g, '').replace(',', '.')); return isNaN(n) ? null : Math.round(n * 100) / 100; }
function fmtPrice(n) { return n == null ? '' : n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function offerOf(i) {
  const o = i.offer;
  if (!o) return null;
  if (typeof o === 'string') return { shop: o, price: null, until: '' };   // aus v1.0/v1.1
  return o.shop || o.price != null ? o : null;
}
function offerExpired(o) { return !!(o && o.until && o.until < todayStr()); }
function offerText(o) {
  const parts = [o.shop, fmtPrice(o.price)].filter(Boolean).join(' ');
  if (!o.until) return parts;
  const d = new Date(o.until + 'T12:00:00');
  return parts + ' · bis ' + d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
}

function loadJSON(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
}
function obj(o) { return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {}; }
function loadData() {
  const d = loadJSON(LS_DATA, null) || {};
  return { items: Array.isArray(d.items) ? d.items : [], favs: obj(d.favs), stars: obj(d.stars), custom: obj(d.custom) };
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function now() { return Date.now(); }
function norm(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function keyOf(name, detail) { return norm(name) + '|' + norm(detail); }
function cap(s) { s = String(s || '').trim(); return s.charAt(0).toUpperCase() + s.slice(1); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function clampQty(q) { q = parseInt(q, 10); return Math.max(1, Math.min(9999, isNaN(q) ? 1 : q)); }
function qtyLabel(i) {
  const u = i.unit || '';
  if (!u) return (i.qty || 1) > 1 ? `${i.qty}×` : '';
  return `${i.qty || 1} ${u}`;
}

/* ---------- Katalog ---------- */
const CAT_INDEX = {};   // norm(Artikel) -> {name, variants, unit, cat}
Object.entries(CATALOG).forEach(([cat, arts]) => arts.forEach(([name, variants, unit]) => {
  CAT_INDEX[norm(name)] = { name, variants, unit, cat };
}));
function articleInfo(name) {
  const k = norm(name);
  const base = CAT_INDEX[k];
  const cu = data.custom[k];
  const variants = [...(base ? base.variants : []), ...((cu && cu.variants) || []).filter(v => !(base && base.variants.some(b => norm(b) === norm(v))))];
  return { name: base ? base.name : (cu ? cu.name : cap(name)), variants, unit: base ? base.unit : (cu ? cu.unit || '' : ''), cat: base ? base.cat : (cu ? cu.cat : null) };
}
function guessCat(name) {
  const info = articleInfo(name);
  if (info.cat) return info.cat;
  const fav = Object.values(data.favs).find(f => norm(f.name) === norm(name));
  if (fav && fav.cat) return fav.cat;
  const n = ' ' + norm(name) + ' ';
  for (const [cat, words] of Object.entries(CAT_WORDS)) if (words.some(w => n.includes(w))) return cat;
  return 'sonst';
}
function rememberArticle(name, detail, cat, unit) {
  const k = norm(name);
  const isBase = !!CAT_INDEX[k];
  const cu = data.custom[k] || { name: cap(name), variants: [], cat, unit };
  let changed = !data.custom[k] && !isBase;
  if (!isBase) { if (cu.cat !== cat) { cu.cat = cat; changed = true; } if (cu.unit !== unit) { cu.unit = unit; changed = true; } }
  const d = String(detail || '').trim();
  if (d && !articleInfo(name).variants.some(v => norm(v) === norm(d))) { cu.variants = [...(cu.variants || []), d]; changed = true; }
  if (changed) { cu.updatedAt = now(); data.custom[k] = cu; }
}

/* ---------- Text-Eingabe ---------- */
function parseInput(text) {
  let t = text.trim().replace(/\s+/g, ' ');
  let qty = 0, m;
  const unit = /^(g|gr|gramm|kg|kilo|ml|l|liter|cl|pfund)\b/i;
  if ((m = t.match(/^(\d{1,3})\s*[x×*]?\s+(.+)$/i)) && !unit.test(m[2])) { qty = +m[1]; t = m[2]; }
  else if ((m = t.match(/^(.+?)\s+[x×*]\s*(\d{1,3})$/i)) || (m = t.match(/^(.+?)\s+(\d{1,3})\s*[x×]$/i))) { qty = +m[2]; t = m[1]; }
  return { name: cap(t), qty };
}

/* ---------- Aktionen ---------- */
function liveItems() { return data.items.filter(i => !i.deleted); }

function addItem({ name, detail = '', qty = 1, unit = '', cat, note = '', offer = null }) {
  name = cap(name); detail = String(detail || '').trim();
  if (!name) return;
  cat = cat || guessCat(name);
  const k = keyOf(name, detail);
  const same = liveItems().filter(i => keyOf(i.name, i.detail) === k);
  const open = same.find(i => !i.checked && (i.unit || '') === unit);
  if (open) {
    open.qty = clampQty((open.qty || 1) + qty); if (offer) open.offer = offer; open.updatedAt = now();
    toast(`${open.name}: jetzt ${qtyLabel(open) || '1×'}`);
  } else {
    const done = same.find(i => i.checked);
    if (done) Object.assign(done, { checked: false, qty: clampQty(qty), unit, cat, note: note || done.note || '', offer, updatedAt: now() });
    else data.items.push({ id: uid(), name, detail, qty: clampQty(qty), unit, cat, note, offer, checked: false, updatedAt: now() });
    toast(`${name}${detail ? ' – ' + detail : ''} hinzugefügt`);
  }
  bumpFav(name, detail, cat, unit);
  rememberArticle(name, detail, cat, unit);
  commit();
}
function bumpFav(name, detail, cat, unit) {
  const k = keyOf(name, detail);
  const f = data.favs[k] || { count: 0 };
  Object.assign(f, { name, detail, cat, unit, count: (f.count || 0) + 1, last: now() });
  data.favs[k] = f;
}
function setStar(name, detail, on, extra = {}) {
  const k = keyOf(name, detail);
  data.stars[k] = { ...(data.stars[k] || {}), name, detail, ...extra, on, updatedAt: now() };
}
function isStar(name, detail) { const s = data.stars[keyOf(name, detail)]; return !!(s && s.on); }
function toggle(id) { const it = data.items.find(i => i.id === id); if (!it) return; it.checked = !it.checked; it.updatedAt = now(); commit(); }
function removeItem(id) {
  const it = data.items.find(i => i.id === id); if (!it) return;
  it.deleted = true; it.updatedAt = now(); commit();
  toast(`„${it.name}“ gelöscht`, () => { it.deleted = false; it.updatedAt = now(); commit(); });
}
function clearDone() {
  const done = liveItems().filter(i => i.checked); if (!done.length) return;
  const t = now(); done.forEach(i => { i.deleted = true; i.updatedAt = t; }); commit();
  toast(`${done.length} erledigte entfernt`, () => { done.forEach(i => { i.deleted = false; i.updatedAt = now(); }); commit(); });
}
function commit() { saveLocal(); renderAll(); schedulePush(); }

function renderList() {
  const items = liveItems();
  const open = items.filter(i => !i.checked), done = items.filter(i => i.checked);
  $('count').textContent = open.length ? `· ${open.length}` : '';
  let html = '';
  if (!items.length) html = '<div class="empty"><b>🧺</b>Die Liste ist leer.<br>Oben eintragen, unter „Artikel“ auswählen oder aus den Favoriten antippen.</div>';
  else {
    const byName = (a, b) => a.name.localeCompare(b.name, 'de') || String(a.detail || '').localeCompare(b.detail || '', 'de');
    const byCat = (a, b) => ((CAT_ORDER[a.cat] ?? 99) - (CAT_ORDER[b.cat] ?? 99)) || byName(a, b);
    if (sortMode === 'shop') {
      const groups = {};
      open.forEach(i => { const s = shopOf(i); (groups[s] = groups[s] || []).push(i); });
      let shops = Object.keys(groups).filter(s => s !== NO_SHOP).sort((a, b) => groups[b].length - groups[a].length || a.localeCompare(b, 'de'));
      if (groups[NO_SHOP]) shops.push(NO_SHOP);
      // Im Markt: dessen Angebote zuerst, dazu alles ohne Händler – nur andere Händler ausblenden
      if (shopFilter && groups[shopFilter]) shops = shopFilter === NO_SHOP ? [NO_SHOP] : [shopFilter, ...(groups[NO_SHOP] ? [NO_SHOP] : [])];
      shops.forEach(s => {
        const list = groups[s].sort(byCat);
        const sum = list.reduce((t, i) => { const o = offerOf(i); return t + (o && o.price != null && s !== NO_SHOP ? o.price * (['g','kg','ml','l'].includes(i.unit) ? 1 : (i.qty || 1)) : 0); }, 0);
        const title = s === NO_SHOP ? '🛒 Ohne Händler' : '🏪 ' + s;
        html += `<section class="group"><h2>${esc(title)}<span class="sub">${list.length} Artikel${sum ? ' · ' + esc(fmtPrice(sum)) : ''}</span></h2><div class="list">${list.map(itemHtml).join('')}</div></section>`;
      });
    } else {
      const groups = {};
      open.forEach(i => (groups[i.cat] = groups[i.cat] || []).push(i));
      Object.keys(groups).sort((a, b) => (CAT_ORDER[a] ?? 99) - (CAT_ORDER[b] ?? 99)).forEach(cat => {
        const list = groups[cat].sort(byName);

/* Vorschläge unter dem Eingabefeld */
function suggestions(q) {
  const n = norm(q); const out = new Map();
  const add = (name, detail, label) => { const k = keyOf(name, detail); if (!out.has(k)) out.set(k, { name, detail, label }); };
  Object.values(data.stars).filter(s => s.on && (norm(s.name).includes(n) || norm(s.detail).includes(n))).forEach(s => add(s.name, s.detail, '★ '));
  Object.values(data.favs).filter(f => norm(f.name).includes(n) || norm(f.detail).includes(n)).sort((a, b) => b.count - a.count).forEach(f => add(f.name, f.detail, ''));
  Object.values(CAT_INDEX).filter(a => norm(a.name).includes(n)).forEach(a => add(a.name, '', ''));
  Object.values(data.custom).filter(a => norm(a.name).includes(n)).forEach(a => add(a.name, '', ''));
  return [...out.values()].slice(0, 10);
}
function renderChips() {
  const q = parseInput($('addName').value).name;
  let html = '';
  if (q) {
    html = suggestions(q).map(s => `<button class="chip" data-sug="${esc(s.name)}" data-detail="${esc(s.detail || '')}">${s.label}${esc(s.name)}${s.detail ? ' · ' + esc(s.detail) : ''}</button>`).join('');
  } else {
    const onList = new Set(liveItems().filter(i => !i.checked).map(i => keyOf(i.name, i.detail)));
    const stars = Object.entries(data.stars).filter(([k, s]) => s.on && !onList.has(k));
    if (stars.length) html = '<span class="chip lbl">⭐</span>' + stars.slice(0, 15).map(([k, s]) => `<button class="chip" data-quick="${esc(k)}">${esc(s.name)}${s.detail ? ' · ' + esc(s.detail) : ''}</button>`).join('');

}

      </div>`).join('') + '</div></section>';
  } else html += '<div class="empty"><b>⭐</b>Noch keine Favoriten.<br>Öffne einen Artikel und tippe oben rechts auf ☆.</div>';
  const often = Object.entries(data.favs).filter(([k]) => !(data.stars[k] && data.stars[k].on)).sort((a, b) => b[1].count - a[1].count).slice(0, 20);
  if (often.length) html += `<section class="group"><h2>Häufig gekauft</h2><div class="chips wrap">${often.map(([k, f]) => `<button class="chip" data-often="${esc(k)}">${esc(f.name)}${f.detail ? ' · ' + esc(f.detail) : ''} <small style="color:var(--muted)">${f.count}×</small></button>`).join('')}</div></section>`;
  $('favMain').innerHTML = html;
}

/* Angebote */
function renderOffers() {
  let html = '<p class="intro">Prospekte zum Stöbern. Die Links öffnen sich im Browser.</p>';
  html += `<section class="group"><h2>Prospekte</h2><div class="list">${OFFER_LINKS.map(([n, s, u]) => `<a class="linkcard" href="${u}" target="_blank" rel="noopener"><span><b>${esc(n)}</b><small>${esc(s)}</small></span><i>↗</i></a>`).join('')}</div></section>`;
  const open = liveItems().filter(i => !i.checked);
  const byShop = {};
  open.forEach(i => { const o = offerOf(i); if (o && !offerExpired(o) && o.shop) (byShop[o.shop] = byShop[o.shop] || []).push({ i, o }); });
  const shops = Object.keys(byShop).sort((a, b) => byShop[b].length - byShop[a].length);
  if (shops.length) {
    html = `<section class="group"><h2>Deine Liste im Angebot</h2><div class="list">${shops.map(s => {
      const rows = byShop[s];
      const sum = rows.reduce((t, r) => t + (r.o.price != null ? r.o.price * (r.i.unit && ['g','kg','ml','l'].includes(r.i.unit) ? 1 : (r.i.qty || 1)) : 0), 0);
      return `<div class="shopcard"><span class="sum">${sum ? fmtPrice(sum) : ''}</span><b>${esc(s)}</b> <span class="hint">· ${rows.length} Artikel</span>
        <ul>${rows.map(r => `<li>${esc(qtyLabel(r.i) ? qtyLabel(r.i) + ' ' : '')}${esc(r.i.name)}${r.i.detail ? ' – ' + esc(r.i.detail) : ''}${r.o.price != null ? ' · ' + esc(fmtPrice(r.o.price)) : ''}</li>`).join('')}</ul></div>`;
    }).join('')}</div></section>` + html;
  }
  if (open.length) {
    html += `<section class="group"><h2>Angebote für deine Liste suchen</h2><div class="list">${open.sort((a, b) => a.name.localeCompare(b.name, 'de')).map(i => {
      const q = (i.detail ? i.name + ' ' + i.detail : i.name);
      return `<a class="linkcard" href="${offerUrl(q)}" target="_blank" rel="noopener"><span>${esc(i.name)}${i.detail ? `<small>${esc(i.detail)}</small>` : ''}</span><i>🔎</i></a>`;
    }).join('')}</div></section>`;
  }
  $('offMain').innerHTML = html;
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(text, undo) {
  $('toastText').textContent = text;
  const btn = $('toastBtn'); btn.hidden = !undo;
  btn.onclick = () => { $('toast').classList.remove('show'); undo && undo(); };
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), undo ? 5000 : 2000);
}

/* ---------- GitHub-Sync ---------- */
function syncConfigured() { return !!(cfg.owner && cfg.repo && cfg.token); }
function setDot(state) { $('syncDot').className = 'dot ' + (state || ''); }
function log(msg, isErr) {
  const l = loadJSON(LS_LOG, []);
  const t = new Date().toLocaleString('de-DE', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  l.unshift({ t, msg, e: !!isErr });
  localStorage.setItem(LS_LOG, JSON.stringify(l.slice(0, 20)));
  renderLog();
}
function renderLog() {
  const l = loadJSON(LS_LOG, []);
  $('syncLog').innerHTML = l.length ? l.map(x => `<div class="${x.e ? 'e' : ''}">${esc(x.t)} – ${esc(x.msg)}</div>`).join('') : 'Noch keine Einträge.';
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
async function gh(method, body, attempt = 0) {
  const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${DATA_FILE}`
            + (method === 'GET' ? `?ref=${encodeURIComponent(cfg.branch || 'main')}&t=${Date.now()}` : '');
  let res;
  try {
    res = await fetch(url, {
      method, cache: 'no-store',
      headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (err) {
    if (attempt < 2) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); return gh(method, body, attempt + 1); }
    throw new Error('Keine Verbindung');
  }
  if ((res.status === 429 || res.status >= 500) && attempt < 2) {
    await new Promise(r => setTimeout(r, 1500 * (attempt + 1))); return gh(method, body, attempt + 1);
  }
  return res;
}

function mergeByUpdated(a, b) {
  const out = { ...obj(b) };
  Object.entries(obj(a)).forEach(([k, v]) => { const r = out[k]; if (!r || (v.updatedAt || 0) > (r.updatedAt || 0)) out[k] = v; });
  return out;
}
function mergeData(local, remote) {
  const byId = new Map();
  [...(remote.items || []), ...(local.items || [])].forEach(it => {
    const prev = byId.get(it.id);
    if (!prev || (it.updatedAt || 0) > (prev.updatedAt || 0)) byId.set(it.id, it);
  });
  const cutoff = now() - TOMBSTONE_DAYS * 864e5;
  const items = [...byId.values()].filter(i => !(i.deleted && (i.updatedAt || 0) < cutoff));
  const favs = { ...obj(remote.favs) };
  Object.entries(obj(local.favs)).forEach(([k, f]) => {
    const r = favs[k];
    if (!r) favs[k] = f;
    else { const newer = (f.last || 0) >= (r.last || 0) ? f : r; favs[k] = { ...newer, count: Math.max(f.count || 0, r.count || 0) }; }
  });
  const stars = mergeByUpdated(local.stars, remote.stars);
  const custom = mergeByUpdated(local.custom, remote.custom);
  // eigene Bezeichnungen beider Seiten zusammenführen
  Object.keys(custom).forEach(k => {
    const vs = new Map();
    [...((obj(local.custom)[k] || {}).variants || []), ...((obj(remote.custom)[k] || {}).variants || [])].forEach(v => { if (!vs.has(norm(v))) vs.set(norm(v), v); });
    custom[k] = { ...custom[k], variants: [...vs.values()] };
  });
  return { items, favs, stars, custom };
}
// Reihenfolge-unabhängiger Vergleich, damit der 30-Sekunden-Abgleich nicht unnötig speichert
function canon(d) {
  const sortKeys = o => (o && typeof o === 'object' && !Array.isArray(o)) ? Object.keys(o).sort().reduce((r, k) => (r[k] = sortKeys(o[k]), r), {}) : o;
  const mapC = m => Object.keys(obj(m)).sort().map(k => [k, sortKeys(m[k])]);
  return JSON.stringify({
    items: [...(d.items || [])].sort((a, b) => a.id < b.id ? -1 : 1).map(sortKeys),
    favs: mapC(d.favs), stars: mapC(d.stars), custom: mapC(d.custom)
  });
}
function sameData(a, b) { return canon(a) === canon(b); }

async function pull() {
  const res = await gh('GET');
  if (res.status === 404) { remoteSha = null; return { items: [], favs: {}, stars: {}, custom: {} }; }
  if (res.status === 401 || res.status === 403) throw new Error('Token ungültig oder ohne Berechtigung (' + res.status + ')');
  if (!res.ok) throw new Error('Laden fehlgeschlagen (' + res.status + ')');
  const j = await res.json();
  remoteSha = j.sha;
  const p = JSON.parse(b64decode(j.content || ''));
  return { items: p.items || [], favs: obj(p.favs), stars: obj(p.stars), custom: obj(p.custom) };
}
async function push() {
  const payload = { app: 'Einkaufsliste', version: APP_VERSION, savedAt: new Date().toISOString(), ...data };
  const body = { message: 'Einkaufsliste aktualisiert', content: b64encode(JSON.stringify(payload, null, 1)), branch: cfg.branch || 'main' };
  if (remoteSha) body.sha = remoteSha;
  const res = await gh('PUT', body);
  if (res.status === 409 || res.status === 422) return 'conflict';
  if (!res.ok) throw new Error('Speichern fehlgeschlagen (' + res.status + ')');
  const j = await res.json(); remoteSha = j.content?.sha || null;
  return 'ok';
}
async function sync(reason) {
  if (!syncConfigured()) { setDot(''); return; }
  if (syncing) { syncQueued = true; return; }
  syncing = true; setDot('busy');
  try {
    for (let round = 0; round < 3; round++) {
      const remote = await pull();
      const merged = mergeData(data, remote);
      const localChanged = !sameData(merged, data);
      const remoteChanged = !sameData(merged, remote);
      if (localChanged) { data = merged; saveLocal(); renderAll(); }
      if (!remoteChanged) { log(`${reason}: aktuell` + (localChanged ? ' (Änderungen geladen)' : '')); break; }
      const r = await push();
      if (r === 'ok') { log(`${reason}: gespeichert` + (localChanged ? ' + Änderungen geladen' : '')); break; }
      if (round === 2) throw new Error('Konflikt nicht lösbar – bitte erneut versuchen');
    }
    setDot('ok');
  } catch (err) {
    setDot('err'); log(`${reason}: ${err.message}`, true);
  } finally {
    syncing = false;
    if (syncQueued) { syncQueued = false; sync('Nachgereicht'); }
  }
}
function schedulePush() {
  if (!syncConfigured()) return;
  setDot('busy'); clearTimeout(pushTimer);
  pushTimer = setTimeout(() => sync('Änderung'), 1500);
}
setInterval(() => { if (document.visibilityState === 'visible') sync('Abgleich'); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync('App geöffnet'); });
$('syncBtn').onclick = () => {
  if (!syncConfigured()) { openSettings(); toast('Bitte zuerst GitHub einrichten'); return; }
  sync('Manuell');
};

function openSettings() {
  $('gOwner').value = cfg.owner || ''; $('gRepo').value = cfg.repo || ''; $('gToken').value = cfg.token || '';
  renderLog(); openSheet('setSheet');
}
$('settingsBtn').onclick = openSettings;
function readCfgForm() { return { owner: $('gOwner').value.trim(), repo: $('gRepo').value.trim(), token: $('gToken').value.trim(), branch: cfg.branch || 'main' }; }
$('gSave').onclick = () => {

$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ app: 'Einkaufsliste', version: APP_VERSION, ...data }, null, 1)], { type: 'application/json' });

$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    data = mergeData(data, { items: j.items || [], favs: obj(j.favs), stars: obj(j.stars), custom: obj(j.custom) });
    commit(); toast('Importiert und zusammengeführt');
  } catch { toast('Datei konnte nicht gelesen werden'); }
  e.target.value = '';
};
$('favReset').onclick = () => { if (!confirm('„Häufig gekauft“ wirklich leeren?')) return; data.favs = {}; commit(); };

/* ---------- Icon, Manifest, Service Worker ---------- */
(function setupPwa() {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  x.fillStyle = '#2f7d4f'; x.fillRect(0, 0, 180, 180);
  x.font = '110px -apple-system, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('🛒', 90, 98);
  const icon = c.toDataURL('image/png');
  $('appleIcon').href = icon;
  const manifest = { name: 'Einkaufsliste', short_name: 'Einkauf', start_url: location.href.split('#')[0].split('?')[0],
    display: 'standalone', background_color: '#f6f4ef', theme_color: '#f6f4ef', icons: [{ src: icon, sizes: '180x180', type: 'image/png' }] };
  const link = document.createElement('link'); link.rel = 'manifest';
  link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(link);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();

$('ver').textContent = 'Einkaufsliste ' + APP_VERSION;
showTab(['liste','artikel','favoriten','angebote'].includes(currentTab) ? currentTab : 'liste');
renderAll();
sync('Start');
